buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '1.9.20'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace 'com.affina.rtlsdk.reactnative'
  compileSdkVersion getExtOrDefault('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion', 23)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
  implementation 'com.affina:rtl-sdk-core:1.0.1'
  implementation 'com.affina:rtl-sdk-location:1.0.1'
}
